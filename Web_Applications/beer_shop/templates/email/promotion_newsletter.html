<div style="font-family: 'Montserrat', sans-serif; max-width: 600px; margin: 0 auto; border: 1px solid #eee; border-radius: 12px; overflow: hidden;">
    <div style="background-color: #1A1A1A; padding: 20px; text-align: center;">
        <h1 style="color: #FFBF00; margin: 0;">FansFans Beers</h1>
    </div>
    
    <div style="padding: 30px; text-align: center; background-color: #ffffff;">
        <h2 style="color: #1A1A1A;">{{product_name}} está em Promoção!</h2>
        
        {% if image_url %}
        <img src="{{ image_url }}" alt="{{ product_name }}" style="max-width: 200px; height: auto; margin: 20px 0;">
        {% endif %}

        <div style="margin: 20px 0;">
            <span style="text-decoration: line-through; color: #999; font-size: 1.2rem;">{{ old_price }}€</span>
            <div style="color: #12c102be; font-size: 2.5rem; font-weight: 800; margin: 10px 0;">
                {{ new_price }}€
                <span style="background: #FFBF00; color: #000; font-size: 0.9rem; padding: 4px 8px; border-radius: 4px; vertical-align: middle;">
                    -{{ promo_percent }}%
                </span>
            </div>
        </div>

        <p style="color: #666; line-height: 1.6;">{{ description|truncatewords:30 }}</p>

        <a href="{{ product_url }}" style="display: inline-block; background-color: #1A1A1A; color: #FFBF00; padding: 15px 30px; text-decoration: none; border-radius: 8px; font-weight: bold; margin-top: 20px; text-transform: uppercase;">
            Aproveitar Agora 🛒
        </a>
    </div>

    <div style="background-color: #f4f4f4; padding: 15px; text-align: center; font-size: 0.8rem; color: #888;">
        Beba com moderação. Esta promoção é limitada ao stock existente.
    </div>
</div>
